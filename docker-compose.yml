version: '3.8'

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - PORT=3000
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Contextual_RAG_CC
      - ENVIRONMENT=development
      - FRONTEND_PORT=3000
      - BACKEND_PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=50
      - STORAGE_DIR=/app/storage
    volumes:
      - ./backend/app/storage:/app/storage
    depends_on:
      - qdrant
    restart: always
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  qdrant_data:
